name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : rien dans cette CI n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

# Une poussée annule l'exécution précédente sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Types, style et tests
    runs-on: ubuntu-latest

    # Base dédiée à la CI. Les utilitaires de test d'AdonisJS remettent la
    # base à zéro : elle ne doit jamais être partagée avec autre chose.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moisson
          POSTGRES_PASSWORD: moisson
          POSTGRES_DB: moisson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: warn
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DATABASE_URL: postgresql://moisson:moisson@localhost:5432/moisson_test
      DB_SSL: false
      # En mémoire : les compteurs ne doivent pas fuir d'un test à l'autre.
      LIMITER_STORE: memory
      # Limites par adresse IP désactivées : tous les tests sortent de la
      # même adresse. Le verrouillage par compte, lui, reste actif et testé.
      RATE_LIMIT_ENABLED: false
      # Aucun worker : les travaux de fond ne doivent pas s'exécuter derrière
      # les assertions, ni pendant la génération du registre ci-dessous.
      QUEUE_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer une clé d'application
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # `@moisson/core` est consommé compilé, pas en source : les trois
      # applications lisent `packages/core/dist`. Il doit donc exister avant
      # que quoi que ce soit d'autre démarre — y compris le serveur lancé
      # plus bas pour produire le registre de routes.
      - name: Compiler le paquet partagé
        run: bun run --filter @moisson/core build

      # `.adonisjs/` n'est pas versionné : contrôleurs, événements et
      # registre de routes sont générés. Sans eux, `start/routes.ts` ne
      # résout pas ses imports et le typecheck échoue.
      - name: Générer les fichiers du serveur
        working-directory: apps/backend
        run: node ace build --ignore-ts-errors

      # Le registre de routes de Tuyau ne peut être produit que par un
      # serveur qui démarre et énumère ses routes — `build` ne le fait pas.
      # On en lance donc un le temps qu'il écrive le fichier, puis on l'arrête.
      - name: Générer le registre de routes
        working-directory: apps/backend
        run: |
          node ace serve > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 90); do
            [ -f .adonisjs/client/registry/schema.d.ts ] && break
            sleep 1
          done
          pkill -f "ace serve" || true
          if [ ! -f .adonisjs/client/registry/schema.d.ts ]; then
            echo "Registre non généré. Journal du serveur :"
            cat /tmp/serve.log
            exit 1
          fi

      - name: Vérifier les types
        run: bun run typecheck

      - name: Analyser le style
        run: bun run lint

      - name: Appliquer les migrations
        working-directory: apps/backend
        run: node ace migration:run --force

      # Sans condition, volontairement : une garde qui saute les tests en
      # silence rend la CI verte sans rien vérifier — ce qui est pire que
      # pas de CI, puisque le vert est cru.
      - name: Lancer les tests
        working-directory: apps/backend
        run: node ace test

      # Les deux clients sont réellement empaquetés, et pas seulement
      # typés. Deux pannes de résolution de modules ont vécu plusieurs
      # jours dans le dépôt précisément parce que rien ne les construisait :
      # elles passaient le typecheck et n'échouaient qu'au bundle.
      - name: Empaqueter l'application mobile
        run: bun run --filter @moisson/mobile bundle

      - name: Construire l'application web
        run: bun run --filter @moisson/web build
        env:
          API_URL: http://localhost:3333/api/v1
          # Le reste du travail tourne en `development`, pour le serveur et
          # ses tests. Next, lui, doit construire en `production` : sinon il
          # mélange les variantes développement et production de React et
          # échoue au prérendu, sur une erreur qui ne dit pas son nom
          # (« Cannot read properties of null (reading 'useContext') »).
          NODE_ENV: production

  secrets:
    name: Analyse anti-secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret publié puis retiré au commit
          # suivant reste présent dans les révisions — et donc compromis.
          fetch-depth: 0

      - name: Rechercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Volontairement non bloquant pour l'instant : les vulnérabilités
      # connues sont transitives, en amont d'Expo, React Native et Next, et
      # ne dépendent pas de nous. Une CI rouge en permanence ne serait plus
      # lue. À rendre bloquant une fois le compte revenu à zéro.
      - name: Auditer les dépendances
        continue-on-error: true
        run: bun audit
