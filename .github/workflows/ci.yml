name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : rien dans cette CI n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

# Une poussée annule l'exécution précédente sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types et style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier les types
        run: bun run typecheck

      - name: Analyser le style
        run: bun run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Base dédiée à la CI. Les tests d'AdonisJS remettent la base à zéro :
    # elle ne doit jamais être partagée avec autre chose.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moisson
          POSTGRES_PASSWORD: moisson
          POSTGRES_DB: moisson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: warn
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DATABASE_URL: postgresql://moisson:moisson@localhost:5432/moisson_test
      DB_SSL: false
      # En mémoire : les compteurs ne doivent pas fuir d'un test à l'autre.
      LIMITER_STORE: memory
      # Aucun worker : les travaux de fond ne doivent pas s'exécuter
      # derrière les assertions.
      QUEUE_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer une clé d'application
        working-directory: apps/backend
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Appliquer les migrations
        working-directory: apps/backend
        run: node ace migration:run --force

      - name: Lancer les tests
        working-directory: apps/backend
        run: |
          if compgen -G "tests/**/*.spec.ts" > /dev/null; then
            node ace test
          else
            echo "Aucun test pour l'instant."
            echo "La base PostgreSQL ci-dessus attend les suites de #18, #19, #20 et #21,"
            echo "qui ne sont pour l'heure vérifiées que par des scripts jetables."
          fi

  secrets:
    name: Analyse anti-secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret publié puis retiré au commit
          # suivant reste présent — et donc compromis.
          fetch-depth: 0

      - name: Rechercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # Volontairement non bloquant pour l'instant : les vulnérabilités
      # connues sont transitives, en amont d'Expo, React Native et Next, et
      # ne dépendent pas de nous. Une CI rouge en permanence ne serait plus
      # lue. À rendre bloquant une fois le compte revenu à zéro.
      - name: Auditer les dépendances
        continue-on-error: true
        run: bun audit
